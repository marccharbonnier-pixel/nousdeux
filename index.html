<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8e4e5"><title>Nous deux — Notre quotidien</title>
<style>
:root{--ink:#342b2b;--muted:#8c7a7b;--accent:#bf7772;--line:#eaddda;--card:#ffffffb8;--shadow:0 12px 40px #85615d0b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6ece9}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b97885;outline-offset:3px}button{border:0;background:none}h1,h2,h3,p{margin:0}h1,h2,.serif{font-family:Georgia,serif;font-weight:400}h1{font-size:30px}h2{font-size:22px}h3{font-size:15px;font-weight:500}small,.muted{color:var(--muted)}small{font-size:12px}.app{max-width:540px;min-height:100dvh;margin:auto;position:relative;background:radial-gradient(ellipse at 100% 0%,#ffdfb8 0%,transparent 49%),radial-gradient(ellipse at 0% 65%,#efdaf3 0%,transparent 65%),linear-gradient(150deg,#fff9ef,#fae1e7 68%,#f9f8e6);box-shadow:0 0 90px #62453a0d}main{padding:30px 20px 118px;min-height:100dvh}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;font-size:12px;color:var(--muted)}.icon{width:35px;height:35px;display:grid;place-items:center;background:#ffffff66;border-radius:50%;font-size:20px}.hero{text-align:center;margin:8px 0 28px}.avatars{display:flex;justify-content:center;align-items:center;margin-bottom:16px}.avatar{display:grid;place-items:center;width:52px;height:52px;border:3px solid #fff9;border-radius:50%;font-size:17px;background:#dcdcc7;color:#625e42}.avatar.other{background:#e7c1b7;color:#81564d}.heart{color:#ce7b8d;background:white;border-radius:50%;width:25px;height:25px;margin:0 -5px;z-index:1}.hero h1{font-size:27px}.hero em{color:#a77048}.hero p{margin-top:6px;color:var(--muted);font-size:12px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:24px 0 12px;text-align:center}.week div{font-size:10px;color:var(--muted)}.dot{display:block;width:8px;height:8px;border-radius:50%;background:#e5d9d2;margin:0 auto 8px}.today .dot{background:#d78a80;box-shadow:0 0 0 4px #d78a8019}.today{color:var(--ink)!important;font-weight:600}.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);padding:17px 6px;border-radius:23px;margin:22px 0}.stats button+button{border-left:1px solid var(--line)}.stats strong{display:block;font-size:20px;font-weight:500}.stats small{font-size:10px}.section-label{font-size:14px;margin:24px 2px 10px}.card{background:var(--card);border-radius:23px;padding:18px;margin-bottom:13px;box-shadow:var(--shadow)}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.row{display:flex;align-items:center;gap:11px;min-height:44px}.row .label{flex:1;min-width:0;overflow-wrap:anywhere}.check{border:1.3px solid #aa9e9a;flex:0 0 21px;width:21px;height:21px;border-radius:50%;padding:0;display:grid;place-items:center;color:white;font-size:12px}.check.checked{background:#d69a8e;border-color:#d69a8e}.done .label{text-decoration:line-through;color:var(--muted)}.row small{font-size:10px}.row .delete{opacity:.5;font-size:17px;padding:4px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:1.8px;color:#8c6f61}.wish-card{background:linear-gradient(115deg,#ffe3c3,#f5cee8);padding:24px;border-radius:24px;text-align:left;width:100%}.wish-card h2{margin:6px 0}.wish-card p{font-size:12px;color:#8b706b}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#fff9f0df;backdrop-filter:blur(22px);border-top:1px solid #ffffffbd;border-radius:26px 26px 0 0;z-index:10;box-shadow:0 -10px 35px #9377720c}.nav button{display:flex;align-items:center;flex-direction:column;gap:4px;font-size:10px;color:#978985;padding:2px}.nav button.active{color:#3c302c;font-weight:650}.nav svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.pagehead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}.subtitle{font-size:12px;color:var(--muted);margin-bottom:28px}.pill{border-radius:30px;background:#ffffff96;padding:8px 13px}.overview{background:linear-gradient(110deg,#ffdfc7,#edcef0);padding:22px 17px;border-radius:25px;margin:20px 0}.overview h2{font-size:21px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:15px 0}.tiles div{border-radius:12px;background:#ffffff73;padding:10px 8px}.tiles b{font-weight:500;display:block;font-size:18px}.tiles small{font-size:10px}.fab{position:fixed;bottom:95px;right:max(20px,calc((100vw - 500px)/2));background:#302625;color:white;padding:14px 20px;border-radius:30px;box-shadow:0 6px 22px #60413720;z-index:11}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.listcard{padding:16px;border-radius:23px;background:var(--card);text-align:left;min-width:0}.listcard .row{min-height:30px;font-size:11px}.listcard .check{width:14px;height:14px;flex-basis:14px;font-size:9px}.listtitle{display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.25;margin-bottom:10px;overflow-wrap:anywhere}.listtitle i{width:6px;height:6px;border-radius:50%;background:#b68c53;flex-shrink:0}.items{padding:4px 13px}.items .row{min-height:49px;border-bottom:1px solid #e9ded77a}.items .row:last-child{border:0}.addbar{display:flex;gap:10px;align-items:center;background:#fffaf2e8;border:1px solid white;border-radius:26px;padding:8px 10px;margin-top:15px}.addbar input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:5px}.send{border-radius:50%;width:32px;height:32px;background:#dedfce;font-size:20px}.back{font-size:25px;padding:0 12px 0 0}.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin:12px 0}.calendar button,.calendar span{min-height:36px;display:grid;place-items:center;border-radius:50%;font-size:12px;position:relative}.calendar .selected{background:#d69a8e;color:#fff}.calendar .has:after{content:'';position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:#ad6d5d}.calendar .weekday{color:var(--muted);font-size:10px;min-height:24px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:12px}.field input,.field select,.field textarea{border:1px solid #e7d9d2;background:#fffaf6;padding:12px;border-radius:12px;width:100%}.primary{background:#352927;color:#fff;padding:13px 20px;border-radius:24px}.secondary{background:#f1e4de;border-radius:24px;padding:12px 16px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}dialog{border:0;background:#fff8f2;color:var(--ink);border-radius:25px;padding:25px;width:calc(100% - 32px);max-width:440px;max-height:90dvh;overflow:auto;box-shadow:0 20px 100px #34202030}dialog::backdrop{background:#372b315e;backdrop-filter:blur(5px)}dialog h2{margin-bottom:22px}.notice{font-size:12px;color:#8b7771;line-height:1.6}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#392b29;color:#fff;border-radius:18px;padding:11px 18px;z-index:30;font-size:12px;width:max-content;max-width:90vw}.hide{display:none}a{color:#a2665d}.danger{color:#a64d50}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input[type=file]{max-width:100%}@media(min-width:700px){main{padding-top:38px}.app{border-left:1px solid white;border-right:1px solid white}}@media(prefers-reduced-motion:no-preference){main{animation:appear .2s ease}@keyframes appear{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head><body><div class="app"><main id="main"></main><nav class="nav" aria-label="Navigation principale" id="nav"></nav></div><dialog id="modal"></dialog><div id="toast" class="toast hide" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=localDate(), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2), key='nous-deux-v1';
function fresh(){return {profile:{a:'Marc',b:'Mon amour',start:'',},tasks:[],lists:[],events:[],wishes:[]}}
let state;try{state=JSON.parse(localStorage.getItem(key))||fresh()}catch(e){state=fresh()}
let page='home',opened=null,filter='all',month=new Date().getMonth(),year=new Date().getFullYear(),selected=today;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){toast('Enregistrement impossible : exportez vos données depuis Profil.')}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hide'),3500)}
function initials(n){return esc(n.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase())}
function avatars(){return `<div class="avatars"><span class="avatar">${initials(state.profile.a)}</span><span class="heart">♥</span><span class="avatar other">${initials(state.profile.b)}</span></div>`}
const icons={home:'<path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z"/>',tasks:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',lists:'<path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h2M13 14h2M7 18h2"/>',profile:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};
function nav(){const labels={home:'Accueil',tasks:'Tâches',lists:'Listes',calendar:'Calendrier',profile:'Profil'};$('#nav').innerHTML=Object.keys(labels).map(k=>`<button data-go="${k}" class="${page===k?'active':''}" ${page===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>${labels[k]}</button>`).join('')}
function go(p){page=p;opened=null;render();window.scrollTo(0,0)}
function formatDate(d){if(!d)return 'Sans date';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function owner(t){return t.owner==='a'?state.profile.a:t.owner==='b'?state.profile.b:'Nous deux'}
function taskrow(t){return `<div class="row ${t.done?'done':''}"><button class="check ${t.done?'checked':''}" data-task="${t.id}" aria-label="${t.done?'Rouvrir':'Terminer'} : ${esc(t.title)}">${t.done?'✓':''}</button><div class="label">${esc(t.title)}<br><small>Pour ${esc(owner(t))}${t.date?' · '+formatDate(t.date):''}</small></div><button class="delete" data-edit-task="${t.id}" aria-label="Modifier la tâche">⋯</button></div>`}
function visibleTasks(){return state.tasks.filter(t=>filter==='all'||t.owner===filter)}
function home(){let count=state.tasks.filter(t=>!t.done).length;let days=state.profile.start?Math.max(0,Math.floor((new Date(today+'T12:00:00')-new Date(state.profile.start+'T12:00:00'))/86400000)):null;let dow=new Date().getDay();let labels=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];let week=Array.from({length:7},(_,i)=>{let n=(i+1)%7;return `<div class="${n===dow?'today':''}"><span class="dot"></span>${labels[n]}</div>`}).join('');return `<div class="topline"><span>${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</span><button class="icon" data-go="profile" aria-label="Paramètres">⋯</button></div><section class="hero">${avatars()}<h1>Bonjour, <em>${esc(state.profile.a)} &amp; ${esc(state.profile.b)}</em></h1><p>${days===null?'Un petit espace, juste pour nous.':days.toLocaleString('fr-FR')+' jours à écrire notre histoire'}</p></section><div class="week">${week}</div><div class="stats"><button data-go="profile"><strong>${days===null?'♡':days}</strong><small>jours ensemble ›</small></button><button data-go="lists"><strong>${state.lists.length}</strong><small>listes partagées ›</small></button><button data-go="tasks"><strong>${count}</strong><small>à faire ›</small></button></div><h3 class="section-label">Moments ensemble</h3><section class="card"><div class="cardhead"><h3>◉ &nbsp; Tâches à faire <small>${count} à faire</small></h3><button data-go="tasks" aria-label="Toutes les tâches">›</button></div>${state.tasks.filter(t=>!t.done).slice(0,3).map(taskrow).join('')||'<p class="empty">Tout est tranquille. Ajoutons nos premières tâches.</p>'}<button class="muted" data-action="new-task">+ Ajouter une tâche</button></section><button class="wish-card" data-go="wishes"><div class="eyebrow">Nos petites et grandes idées</div><h2>Envies <span style="float:right">☆</span></h2><p>Ce que chacun veut, pour que les cadeaux tombent juste.</p></button><section class="card" style="margin-top:14px"><div class="cardhead"><h3>Prochain rendez-vous</h3><button data-go="calendar">›</button></div>${state.events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,1).map(e=>`<p>${esc(e.title)}</p><small>${formatDate(e.date)} ${esc(e.time||'')}</small>`).join('')||'<p class="muted">Un dîner, une balade, un moment à deux…</p>'}</section>`}
function tasks(){let all=visibleTasks(),active=all.filter(t=>!t.done);let end=new Date(today+'T12:00:00');end.setDate(end.getDate()+7);let limit=localDate(end);let groups=[['En retard',active.filter(t=>t.date&&t.date<today)],['Aujourd’hui',active.filter(t=>t.date===today)],['Cette semaine',active.filter(t=>t.date>today&&t.date<=limit)],['Plus tard ou sans date',active.filter(t=>!t.date||t.date>limit)],['Faites',all.filter(t=>t.done)]];return `<div class="pagehead"><select class="pill" id="task-filter" aria-label="Filtrer les tâches"><option value="all">Toutes</option><option value="both">Pour nous deux</option><option value="a">${esc(state.profile.a)}</option><option value="b">${esc(state.profile.b)}</option></select><span class="muted">Notre quotidien</span></div><section class="overview"><h2>${active.length} tâche${active.length>1?'s':''} en cours</h2><div class="tiles"><div><b>${active.filter(t=>t.date===today).length}</b><small>Aujourd’hui</small></div><div><b>${active.filter(t=>t.date>today&&t.date<=limit).length}</b><small>7 prochains jours</small></div><div><b>${active.filter(t=>!t.date||t.date>limit).length}</b><small>Plus tard</small></div></div><small>${all.filter(t=>t.done).length} tâche(s) terminée(s)</small></section>${groups.filter(g=>g[1].length).map(g=>`<section class="card"><h3>${g[0]} <small>${g[1].length} tâche(s)</small></h3>${g[1].map(taskrow).join('')}</section>`).join('')||'<div class="empty">Aucune tâche pour le moment.</div>'}<button class="fab" data-action="new-task">＋ Nouvelle tâche</button>`}
function lists(){if(opened){let list=state.lists.find(l=>l.id===opened);if(!list){opened=null;return lists()}return `<div class="pagehead"><button class="back" data-action="back-list" aria-label="Retour aux listes">‹</button><h2 style="flex:1">${esc(list.title)}</h2><button class="icon" data-action="edit-list" aria-label="Modifier la liste">⋯</button></div><p class="subtitle">${list.items.filter(i=>i.done).length} / ${list.items.length} éléments cochés</p><section class="card items">${list.items.map(i=>`<div class="row ${i.done?'done':''}"><button class="check ${i.done?'checked':''}" data-item="${i.id}" aria-label="Cocher ${esc(i.title)}">${i.done?'✓':''}</button><span class="label">${esc(i.title)}</span><button class="delete" data-delete-item="${i.id}" aria-label="Supprimer ${esc(i.title)}">×</button></div>`).join('')||'<p class="empty">Votre liste commence ici.</p>'}</section><form id="item-form" class="addbar"><span>＋</span><input name="title" placeholder="Ajouter à ${esc(list.title)}…" required maxlength="180" aria-label="Nouvel élément" autocomplete="off"><button class="send" aria-label="Ajouter">↑</button></form>`}return `<div class="pagehead"><h1>Listes</h1></div><p class="subtitle">Les courses, les films, les projets</p><div class="grid">${state.lists.map(l=>`<button class="listcard" data-list="${l.id}"><div class="listtitle"><i></i>${esc(l.title)}</div>${l.items.slice(0,4).map(i=>`<div class="row ${i.done?'done':''}"><span class="check ${i.done?'checked':''}">${i.done?'✓':''}</span><span class="label">${esc(i.title)}</span></div>`).join('')||'<small>Aucun élément</small>'}${l.items.length>4?`<small>+${l.items.length-4}</small>`:''}</button>`).join('')}</div>${!state.lists.length?'<div class="empty">Une liste de courses, un voyage à préparer,<br>des films à regarder ensemble…</div>':''}<button class="fab" data-action="new-list">＋ Nouvelle liste</button>`}
function calendar(){let first=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate();return `<div class="pagehead"><h1>Calendrier</h1></div><p class="subtitle">Du temps pour nous, et pour tout le reste.</p><section class="card"><div class="cardhead"><button class="icon" data-month="-1" aria-label="Mois précédent">‹</button><h2>${new Date(year,month).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><button class="icon" data-month="1" aria-label="Mois suivant">›</button></div><div class="calendar">${['L','M','M','J','V','S','D'].map(x=>`<span class="weekday">${x}</span>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:days},(_,i)=>{let date=localDate(new Date(year,month,i+1));return `<button data-day="${date}" class="${date===selected?'selected':''} ${state.events.some(e=>e.date===date)||state.tasks.some(t=>t.date===date&&!t.done)?'has':''}" aria-label="${date}">${i+1}</button>`}).join('')}</div></section><h3 class="section-label">${new Date(selected+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h3><section class="card">${state.events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(e=>`<div class="row"><span>◷</span><div class="label">${esc(e.title)}<br><small>${esc(e.time||'Toute la journée')}${e.note?' · '+esc(e.note):''}</small></div><button data-event="${e.id}" aria-label="Modifier l’événement">⋯</button></div>`).join('')}${state.tasks.filter(t=>t.date===selected).map(taskrow).join('')}${!state.events.some(e=>e.date===selected)&&!state.tasks.some(t=>t.date===selected)?'<p class="empty">Une journée encore libre.</p>':''}</section><button class="fab" data-action="new-event">＋ Un moment à deux</button>`}
function wishes(){return `<div class="pagehead"><h1>Nos envies</h1><span style="font-size:25px;color:#b78767">☆</span></div><p class="subtitle">Des idées à garder, des attentions à offrir.</p>${state.wishes.map(w=>`<section class="card"><div class="row"><span>☆</span><div class="label"><h3>${esc(w.title)}</h3><small>Pour ${esc(owner(w))}${w.note?' · '+esc(w.note):''}</small></div><button data-delete-wish="${w.id}" aria-label="Supprimer l’envie">×</button></div></section>`).join('')||'<div class="empty">Un livre, une escapade, un dîner…<br>Gardons nos idées au même endroit.</div>'}<button class="fab" data-action="new-wish">＋ Ajouter une envie</button>`}
function profile(){return `<div class="pagehead"><h1>Notre espace</h1></div><p class="subtitle">Les petits détails qui font nous.</p>${avatars()}<section class="card"><form id="profile-form"><div class="profile-grid"><label class="field">Votre prénom<input name="a" value="${esc(state.profile.a)}" required maxlength="35"></label><label class="field">Son prénom<input name="b" value="${esc(state.profile.b)}" required maxlength="35"></label></div><label class="field">Ensemble depuis le<input type="date" name="start" value="${esc(state.profile.start)}" max="${today}"></label><button class="primary">Enregistrer</button></form></section><section class="card"><h2>Nos données</h2><p class="notice" style="margin:12px 0">Cette version garde vos données uniquement dans ce navigateur, sur cet appareil. Elle ne les synchronise pas entre vos téléphones. Le mode privé ou l’effacement du navigateur peut les supprimer. Faites des sauvegardes régulières.</p><div class="actions" style="justify-content:flex-start"><button class="secondary" data-action="export">Exporter</button><button class="secondary" data-action="import">Importer</button></div><input type="file" id="import-file" accept="application/json,.json" class="hide"></section><section class="card"><h3>Bienvenue chez nous</h3><p class="notice" style="margin:10px 0">Vous pouvez partir de zéro ou ajouter des exemples pour découvrir les écrans. Les exemples s’ajoutent à vos données.</p><button class="secondary" data-action="demo">Ajouter des exemples</button><button class="danger" style="display:block;margin-top:20px" data-action="reset">Effacer toutes les données</button></section>`}
function render(){nav();$('#main').innerHTML=({home,tasks,lists,calendar,profile,wishes}[page]||home)();if(page==='tasks')$('#task-filter').value=filter}
function openDialog(content){$('#modal').innerHTML=content;$('#modal').showModal()}
function ownerSelect(value='both'){return `<label class="field">Pour qui ?<select name="owner"><option value="both" ${value==='both'?'selected':''}>Nous deux</option><option value="a" ${value==='a'?'selected':''}>${esc(state.profile.a)}</option><option value="b" ${value==='b'?'selected':''}>${esc(state.profile.b)}</option></select></label>`}
function buttons(edit=false){return `<div class="actions">${edit?'<button type="button" class="danger" data-action="delete-current">Supprimer</button>':''}<button type="button" class="secondary" data-action="close">Annuler</button><button class="primary">Enregistrer</button></div>`}
let editing=null,editType=null;
function taskDialog(id){let t=state.tasks.find(t=>t.id===id)||{title:'',date:'',owner:'both'};editing=id||null;editType='task';openDialog(`<h2>${id?'Modifier la tâche':'Une chose à faire'}</h2><form id="task-form"><label class="field">Tâche<input name="title" required maxlength="180" value="${esc(t.title)}" placeholder="Rempoter les plantes du balcon"></label>${ownerSelect(t.owner)}<label class="field">Date (facultative)<input type="date" name="date" value="${esc(t.date)}"></label>${buttons(!!id)}</form>`)}
function listDialog(edit=false){let l=edit?state.lists.find(l=>l.id===opened):null;editing=l?.id||null;editType='list';openDialog(`<h2>${edit?'Modifier la liste':'Une nouvelle liste'}</h2><form id="list-form"><label class="field">Nom de la liste<input name="title" required maxlength="80" value="${esc(l?.title||'')}" placeholder="Nos courses"></label>${buttons(edit)}</form>`)}
function eventDialog(id){let e=state.events.find(e=>e.id===id)||{title:'',date:selected,time:'',note:''};editing=id||null;editType='event';openDialog(`<h2>${id?'Modifier ce moment':'Un moment à deux'}</h2><form id="event-form"><label class="field">Titre<input name="title" required maxlength="180" value="${esc(e.title)}" placeholder="Dîner en amoureux"></label><label class="field">Date<input name="date" type="date" required value="${esc(e.date)}"></label><label class="field">Heure (facultative)<input name="time" type="time" value="${esc(e.time)}"></label><label class="field">Lieu ou note<input name="note" maxlength="250" value="${esc(e.note)}"></label>${buttons(!!id)}</form>`)}
function confirmDialog(title,text,action){openDialog(`<h2>${title}</h2><p class="notice">${text}</p><div class="actions"><button class="secondary" data-action="close">Annuler</button><button class="primary" data-action="${action}">Confirmer</button></div>`)}
const actions={ 'new-task':()=>taskDialog(), 'new-list':()=>listDialog(), 'edit-list':()=>listDialog(true),'back-list':()=>{opened=null;render()},'new-event':()=>eventDialog(),close:()=>$('#modal').close(),'new-wish':()=>{openDialog(`<h2>Une nouvelle envie</h2><form id="wish-form"><label class="field">Une idée<input name="title" required maxlength="180" placeholder="Un week-end à deux"></label>${ownerSelect()}<label class="field">Quelques détails<input name="note" maxlength="250" placeholder="Couleur, taille, lieu…"></label>${buttons()}</form>`)},'delete-current':()=>confirmDialog('Supprimer cet élément ?','Cette suppression est définitive.','confirm-delete'),'confirm-delete':()=>{let prop={task:'tasks',list:'lists',event:'events'}[editType];state[prop]=state[prop].filter(x=>x.id!==editing);if(editType==='list')opened=null;save();$('#modal').close();render()},export:()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nous-deux-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},import:()=>$('#import-file').click(),reset:()=>confirmDialog('Tout effacer ?','Vos tâches, listes, événements, envies et prénoms seront effacés sur cet appareil. Exportez-les avant de continuer.','confirm-reset'),'confirm-reset':()=>{state=fresh();save();$('#modal').close();render();toast('Votre espace a été réinitialisé.')},demo:()=>{state.tasks.push({id:uid(),title:'Rempoter les plantes du balcon',owner:'both',date:today,done:false},{id:uid(),title:'Préparer notre prochaine escapade',owner:'a',date:'',done:false});state.lists.push({id:uid(),title:'Nos courses',items:['Gnocchis','Bouillon de légumes','Muesli','Mozzarella','Roquette'].map(title=>({id:uid(),title,done:false}))},{id:uid(),title:'Nos projets',items:[{id:uid(),title:'Choisir notre prochaine destination',done:false}]});state.events.push({id:uid(),title:'Un dîner à deux',date:today,time:'19:30',note:'Notre moment à nous'});save();render();toast('Exemples ajoutés.')}};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.go){go(d.go);return}if(d.action){actions[d.action]?.();return}if(d.task){let t=state.tasks.find(t=>t.id===d.task);t.done=!t.done;save();render()}if(d.editTask)taskDialog(d.editTask);if(d.list){opened=d.list;render()}if(d.item){let i=state.lists.find(l=>l.id===opened).items.find(i=>i.id===d.item);i.done=!i.done;save();render()}if(d.deleteItem){let l=state.lists.find(l=>l.id===opened);l.items=l.items.filter(i=>i.id!==d.deleteItem);save();render()}if(d.month){let dt=new Date(year,month+Number(d.month),1);month=dt.getMonth();year=dt.getFullYear();render()}if(d.day){selected=d.day;render()}if(d.event)eventDialog(d.event);if(d.deleteWish){editing=d.deleteWish;confirmDialog('Supprimer cette envie ?','Cette idée sera retirée de vos envies.','confirm-wish')} });
actions['confirm-wish']=()=>{state.wishes=state.wishes.filter(w=>w.id!==editing);save();$('#modal').close();render()};
document.addEventListener('submit',e=>{e.preventDefault();let form=e.target,f=Object.fromEntries(new FormData(form));for(let k in f)f[k]=f[k].trim();if('title'in f&&!f.title){toast('Saisissez un titre.');return}if(form.id==='profile-form'){if(!f.a||!f.b){toast('Saisissez les deux prénoms.');return}state.profile=f;save();render();toast('Votre espace est personnalisé.');return}if(form.id==='item-form'){state.lists.find(l=>l.id===opened).items.push({id:uid(),title:f.title,done:false});save();render();$('#item-form input').focus();return}if(form.id==='task-form'){if(editing)Object.assign(state.tasks.find(t=>t.id===editing),f);else state.tasks.push({id:uid(),...f,done:false})}if(form.id==='list-form'){if(editing)state.lists.find(l=>l.id===editing).title=f.title;else {let id=uid();state.lists.push({id,title:f.title,items:[]});opened=id;page='lists'}}if(form.id==='event-form'){if(editing)Object.assign(state.events.find(t=>t.id===editing),f);else state.events.push({id:uid(),...f});selected=f.date;let dt=new Date(f.date+'T12:00:00');month=dt.getMonth();year=dt.getFullYear()}if(form.id==='wish-form')state.wishes.push({id:uid(),...f});save();$('#modal').close();render()});
function validImport(s){const str=(x,n=500)=>typeof x==='string'&&x.length<=n;const date=x=>str(x,10)&&(!x||/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(Date.parse(x)));const arr=x=>Array.isArray(x)&&x.length<=10000;const base=x=>x&&str(x.id,100)&&str(x.title);const own=x=>['a','b','both'].includes(x);return s&&s.profile&&str(s.profile.a,35)&&s.profile.a.trim()&&str(s.profile.b,35)&&s.profile.b.trim()&&date(s.profile.start)&&arr(s.tasks)&&s.tasks.every(x=>base(x)&&date(x.date)&&own(x.owner)&&typeof x.done==='boolean')&&arr(s.lists)&&s.lists.every(x=>base(x)&&arr(x.items)&&x.items.every(i=>base(i)&&typeof i.done==='boolean'))&&arr(s.events)&&s.events.every(x=>base(x)&&x.date&&date(x.date)&&str(x.time,5)&&(!x.time||/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time))&&str(x.note))&&arr(s.wishes)&&s.wishes.every(x=>base(x)&&own(x.owner)&&str(x.note))}
let pendingImport=null;document.addEventListener('change',async e=>{if(e.target.id==='task-filter'){filter=e.target.value;render()}if(e.target.id==='import-file'){let file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error();let s=JSON.parse(await file.text());if(!validImport(s))throw Error();pendingImport=s;confirmDialog('Remplacer les données ?','Le fichier de sauvegarde remplacera toutes les données présentes sur cet appareil.','confirm-import')}catch(err){toast('Fichier invalide ou incompatible. Aucune donnée modifiée.')}e.target.value=''}});actions['confirm-import']=()=>{state=pendingImport;pendingImport=null;save();$('#modal').close();render();toast('Sauvegarde importée.')};
render();
</script></body></html>
